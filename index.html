<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World Enhanced</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button class="theme-toggle" onclick="changeTheme()">🎨 Change Theme</button>
    <div class="click-counter">Clicks: <span id="clickCount">0</span></div>
    <button class="game-toggle" onclick="toggleGame()">🎮 Mini Game</button>

    <div class="floating-text">HELLO</div>
    <div class="floating-text" style="animation-delay: -5s;">WORLD</div>
    <div class="floating-text" style="animation-delay: -10s;">CSS</div>
    <div class="floating-text" style="animation-delay: -15s;">JS</div>

    <div class="hello-container" onclick="handleClick()">
        <h1 id="mainTitle">Hello World!</h1>
        <p class="subtitle">BEAUTIFUL <span class="highlight">INTERACTIVE</span> DESIGN</p>
        
        <div class="decoration">
            <div class="orb" onclick="changeOrbColor(event, this)"></div>
            <div class="orb" onclick="changeOrbColor(event, this)"></div>
            <div class="orb" onclick="changeOrbColor(event, this)"></div>
            <div class="orb" onclick="changeOrbColor(event, this)"></div>
        </div>
        
        <p class="subtitle" id="dynamicText">CLICK ANYWHERE • CHANGE COLORS • HAVE FUN</p>
    </div>

    <!-- Mini Game Container -->
    <div class="game-container" id="gameContainer">
        <div class="game-header">
            <h2>🎯 Color Match Game</h2>
            <button class="close-game" onclick="toggleGame()">✕</button>
        </div>
        <div class="game-stats">
            <div class="stat">Score: <span id="gameScore">0</span></div>
            <div class="stat">Time: <span id="gameTime">30</span>s</div>
            <div class="stat">Level: <span id="gameLevel">1</span></div>
        </div>
        <div class="game-target" id="gameTarget">
            <div class="target-color" id="targetColor"></div>
            <div class="target-text">Match this color!</div>
        </div>
        <div class="game-options" id="gameOptions">
            <!-- Color options will be generated by JavaScript -->
        </div>
        <div class="game-controls">
            <button class="game-btn" onclick="startGame()">Start Game</button>
            <button class="game-btn" onclick="resetGame()">Reset</button>
        </div>
        <div class="game-message" id="gameMessage"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
